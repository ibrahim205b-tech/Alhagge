<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطعم الحجي</title>
<style>
:root{--r:#c8102e;--g:#f2b705;--bg:#1a1716;--c:#262221;--c2:#322d2b;--t:#fff8ec;--m:#a89f95;--ok:#2fbf71;--bad:#ff4d4d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.5 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--c2);min-height:44px;transition:transform .08s,background .15s}
button:active{transform:scale(.96)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g)}
.pri{background:var(--r);font-weight:700}.gold{background:var(--g);color:#201a00;font-weight:700}.ok{background:var(--ok);color:#06210f;font-weight:700}.bad{background:var(--bad);color:#2b0000}
input,select,textarea{background:var(--c2);border:1px solid #433c39;border-radius:10px;padding:10px;width:100%}
.top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#120f0e;border-bottom:3px solid var(--r);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:20px;color:var(--g)}.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px}.tabs a{padding:8px 14px;border-radius:20px;background:var(--c);color:var(--t);text-decoration:none;white-space:nowrap}.tabs a.on{background:var(--g);color:#201a00;font-weight:700}
main{padding:14px;max-width:1200px;margin:auto}
.card{background:var(--c);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #38312f}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--c);border-radius:14px;padding:12px;border-inline-start:4px solid var(--g)}.kpi b{display:block;font-size:26px;color:var(--g)}.kpi span{color:var(--m);font-size:13px}
.pos{display:grid;grid-template-columns:104px 1fr;gap:10px;direction:ltr}.pos>*{direction:rtl}
.cats{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.cats button{text-align:center;padding:12px 4px}.cats .on{background:var(--r);font-weight:700}
.prods{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.prod{background:var(--c);border:1px solid #433c39;text-align:right;min-height:84px}.prod b{color:var(--g);display:block}.prod.off{opacity:.4}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:var(--c2)}
.late{color:var(--bad);font-weight:700;animation:bl 1s infinite alternate}@keyframes bl{to{opacity:.4}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.f1{flex:1!important}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #38312f;text-align:right;font-size:14px}
.tl{border-inline-start:3px solid var(--r);padding-inline-start:12px}.tl div{margin:6px 0}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal.on{display:flex}#modal>div{background:var(--c);border-radius:16px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:4px solid var(--g)}
#toast{position:fixed;bottom:16px;inset-inline:16px;display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;align-items:center}
.ti{background:var(--g);color:#201a00;padding:10px 16px;border-radius:12px;font-weight:700;animation:up .2s}.ti.e{background:var(--bad);color:#fff}@keyframes up{from{transform:translateY(12px);opacity:0}}
.login{max-width:360px;margin:12vh auto;text-align:center}.login h1{color:var(--g);font-size:40px}.login input{margin:6px 0}
.call{background:linear-gradient(90deg,#5c0a17,var(--c));animation:pulse 1.4s infinite alternate}@keyframes pulse{to{box-shadow:0 0 0 3px var(--r)}}
.big{width:100%;padding:18px;font-size:18px;margin-top:8px}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block!important;width:76mm;color:#000;background:#fff;font:12px/1.4 monospace;direction:rtl}#rc table td{border:0;padding:1px;color:#000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div><div id="rc"></div>
<script>
"use strict";
/* ===== Utilities ===== */
const $=s=>document.querySelector(s), fmt=n=>(+n||0).toLocaleString('en-US')+' د.ع',
 hm=t=>t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'-',
 esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
 uid=()=>Math.random().toString(36).slice(2,10), val=id=>($('#'+id)||{}).value||'';
/* ===== Storage Adapter (swap for REST later) ===== */
const Store={get(k,d){try{const v=localStorage.getItem('hj_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){localStorage.setItem('hj_'+k,JSON.stringify(v))},del(k){localStorage.removeItem('hj_'+k)}};
/* ===== Event Bus (swap for WebSocket/SSE later) ===== */
const Bus={h:{},on(e,f){(this.h[e]=this.h[e]||[]).push(f)},emit(e,p){[...(this.h[e]||[]),...(this.h['*']||[])].forEach(f=>f(e,p))}};
/* ===== Auth (credentials internal only; replace with API) ===== */
const USERS=[{id:'e0',u:'0000',p:'8876',role:'employee',name:'موظف الاستقبال'},{id:'m1',u:'Yahya',p:'07712323615##@',role:'manager',name:'يحيى'},
 {id:'d1',u:'1111',p:'1234',role:'driver',name:'أحمد'},{id:'d2',u:'2222',p:'12345',role:'driver',name:'علي'},{id:'d3',u:'3333',p:'12345',role:'driver',name:'حسين'},{id:'d4',u:'4444',p:'1234',role:'driver',name:'محمد'}];
const Auth={login(u,p){const x=USERS.find(a=>a.u===u&&a.p===p);if(!x)return null;Store.set('sess',x.id);return x},me(){return USERS.find(a=>a.id===Store.get('sess'))||null},logout(){Store.del('sess')}};
/* ===== Authorization ===== */
const ROUTES={employee:['pos','kitchen','dispatch'],manager:['pulse','orders','reports','audit','settings'],driver:['driver']};
const LABEL={pos:'أخذ طلب',kitchen:'المطبخ',dispatch:'التوصيل',pulse:'نبض المطعم',orders:'الطلبات',reports:'التقارير',audit:'التدقيق',settings:'الإعدادات',driver:'طلباتي'};
const can=(role,route)=>(ROUTES[role]||[]).includes(route);
/* ===== State ===== */
const CATS=['العروض','شرقي','غربي','دجاج','مشويات','فلافل','مقبلات','مشروبات','حلويات','إضافات'];
const ST={NEW:'جديد',CONFIRMED:'مؤكد',PRINTED:'مطبوع',PREPARING:'قيد التحضير',READY:'جاهز',DRIVER_ASSIGNED:'بانتظار قبول السائق',DRIVER_ACCEPTED:'السائق وافق',PICKED_UP:'استلمه السائق',OUT_FOR_DELIVERY:'بالطريق',DELIVERED:'تم التسليم',PAYMENT_CONFIRMED:'تم قبض المبلغ',COMPLETED:'مكتمل',CANCELLED:'ملغي',RETURNED:'مرتجع',FAILED_DELIVERY:'فشل التوصيل'};
const ACTIVE=['CONFIRMED','PRINTED','PREPARING','READY','DRIVER_ASSIGNED','DRIVER_ACCEPTED','PICKED_UP','OUT_FOR_DELIVERY','DELIVERED'];
const WITH_DRV=['DRIVER_ASSIGNED','DRIVER_ACCEPTED','PICKED_UP','OUT_FOR_DELIVERY','DELIVERED'];
function seed(){
 const P=[['برغر لحم','غربي',6500,'grill'],['برغر دجاج','غربي',6000,'grill'],['بطاطا مقلية','غربي',2500,'kitchen'],['شاورما عربي','شرقي',3500,'kitchen'],['شاورما صاج','شرقي',4000,'kitchen'],
 ['نص دجاج مشوي','دجاج',9000,'grill'],['زنجر','دجاج',5500,'kitchen'],['كباب','مشويات',12000,'grill'],['تكة لحم','مشويات',13000,'grill'],['فلافل ساندويتش','فلافل',1500,'kitchen'],
 ['حمص','مقبلات',2500,'kitchen'],['متبل','مقبلات',2500,'kitchen'],['بيبسي','مشروبات',1000,'drinks'],['عصير برتقال','مشروبات',2000,'drinks'],['كنافة','حلويات',4000,'dessert'],
 ['وجبة عائلية','العروض',27000,'grill'],['عرض برغر ×2','العروض',11500,'grill'],['صوص إضافي','إضافات',500,'kitchen']];
 const db={restaurantId:'r1',branchId:'b1',seq:1041,products:P.map((p,i)=>({id:'p'+i,name:p[0],cat:p[1],price:p[2],station:p[3],on:true,active:true})),
  orders:[],audit:[],calls:[],prices:[],session:null,draft:{items:[],type:'delivery',cat:'العروض'},settings:{fee:2000,phone:'0780 000 0000'},settle:{}};
 const t0=Date.now()-3600e3;
 [[0,1,'07801112233','الكرادة قرب الجسر',[[0,1],[2,1],[12,1]],'d1'],[1,1,'07709998877','المنصور شارع 14',[[5,1],[10,1]],'d1'],[2,1,'07512345678','الجادرية',[[7,2]],'d2']].forEach((x,i)=>{
  const items=x[4].map(([pi,q])=>({pid:'p'+pi,name:P[pi][0],price:P[pi][2],qty:q,station:P[pi][3]}));
  const sub=items.reduce((s,a)=>s+a.price*a.qty,0),total=sub+2000,t=t0+i*900e3,d=USERS.find(u=>u.id===x[5]);
  db.orders.push({id:uid(),orderNumber:1038+i,restaurantId:'r1',branchId:'b1',customerPhone:x[2],customerName:'',address:x[3],near:'',items,subtotal:sub,deliveryFee:2000,discount:0,total,
   payment:{expectedAmount:total,collectedAmount:total,method:'cash',status:'paid',collectedBy:d.id,collectedAt:t+2400e3,difference:0},employeeId:'e0',employeeName:'موظف الاستقبال',driverId:d.id,driverName:d.name,status:'COMPLETED',
   kNote:'',dNote:'',printCount:1,tl:[{t:t,s:'CONFIRMED',by:'موظف الاستقبال'},{t:t+240e3,s:'PREPARING',by:'المطبخ'},{t:t+900e3,s:'READY',by:'المطبخ'},{t:t+960e3,s:'DRIVER_ASSIGNED',by:'موظف الاستقبال'},{t:t+1000e3,s:'DRIVER_ACCEPTED',by:d.name},{t:t+1200e3,s:'PICKED_UP',by:d.name},{t:t+2300e3,s:'DELIVERED',by:d.name},{t:t+2400e3,s:'COMPLETED',by:d.name}],
   pickedUpAt:t+1200e3,readyAt:t+900e3,deliveredAt:t+2300e3});
 });
 db.seq=1041;db.calls=[{id:uid(),n:'07801112233',at:t0,res:'order'},{id:uid(),n:'07700000000',at:t0+500e3,res:'none'}];return db;}
let db=Store.get('db')||seed(), me=Auth.me(), ui={route:null,modal:null,submitting:false,tab:'',q:'',filter:'all',printing:null};
const save=()=>Store.set('db',db);
/* ===== Audit Service ===== */
const Audit={log(action,type,id,before,after,reason){db.audit.unshift({id:uid(),actorId:me&&me.id,actorRole:me&&me.role,actor:me&&me.name,action,entityType:type,entityId:id,before,after,reason:reason||'',timestamp:Date.now()});db.audit=db.audit.slice(0,500)}};
/* ===== Notifications ===== */
function toast(m,e){const d=document.createElement('div');d.className='ti'+(e?' e':'');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200);if(!e&&navigator.vibrate&&me&&me.role==='driver')try{navigator.vibrate(200)}catch(_){}}
/* ===== Order Service ===== */
const Orders={
 get:n=>db.orders.find(o=>o.id===n||o.orderNumber===+n),
 setStatus(o,s,reason){const b=o.status;o.status=s;o.tl.push({t:Date.now(),s,by:me.name,reason:reason||''});Audit.log('STATUS','order','#'+o.orderNumber,b,s,reason);save();Bus.emit('ORDER_'+s,o)},
 create(){
  const d=db.draft;if(ui.submitting)return;if(!d.items.length)return toast('السلة فارغة',1);if(d.type==='delivery'&&!(d.addr||'').trim())return toast('اكتب عنوان الزبون',1);if(!(d.phone||'').trim())return toast('رقم الزبون مطلوب',1);
  ui.submitting=true;
  const sub=d.items.reduce((s,a)=>s+a.price*a.qty,0),fee=d.type==='delivery'?db.settings.fee:0,disc=+d.discount||0,total=sub+fee-disc;
  const o={id:uid(),orderNumber:++db.seq,restaurantId:db.restaurantId,branchId:db.branchId,type:d.type,customerPhone:d.phone,customerName:d.name||'',address:d.addr||'',near:d.near||'',items:d.items.map(a=>({...a})),subtotal:sub,deliveryFee:fee,discount:disc,total,
   payment:{expectedAmount:total,collectedAmount:null,method:'cash',status:'unpaid',difference:0},employeeId:me.id,employeeName:me.name,driverId:null,driverName:'',status:'CONFIRMED',kNote:d.knote||'',dNote:d.dnote||'',printCount:0,tl:[],callSession:db.session&&db.session.id};
  if(db.session)o.tl.push({t:db.session.startedAt,s:'CALL',by:'اتصال'});
  o.tl.push({t:Date.now(),s:'CONFIRMED',by:me.name});db.orders.unshift(o);
  db.draft={items:[],type:'delivery',cat:d.cat};if(db.session)db.session.orderId=o.id;
  Audit.log('CREATE','order','#'+o.orderNumber,null,'CONFIRMED');save();ui.submitting=false;ui.printing=o.id;Bus.emit('ORDER_CREATED',o);showReceipt(o.id);
 },
 printed(o){ // after successful print flow
  o.printCount++;if(o.status==='CONFIRMED'){this.setStatus(o,'PRINTED');if(db.session&&db.session.orderId===o.id){endCall('order')}}else{Audit.log('REPRINT','order','#'+o.orderNumber,null,null,'إعادة طباعة');save()}ui.printing=null;
 }};
function endCall(res){if(!db.session)return;db.calls.unshift({id:db.session.id,n:db.session.callerNumber,at:db.session.startedAt,res});Audit.log('CALL_END','call',db.session.callerNumber,'ACTIVE',res);db.session=null;db.draft.phone='';save();Bus.emit('CALL_ENDED')}
const busyDrivers=()=>new Set(db.orders.filter(o=>WITH_DRV.includes(o.status)).map(o=>o.driverId));
/* ===== Receipt / Printing Service ===== */
function receiptHTML(o){return `<div style="text-align:center"><b style="font-size:16px">مطعم الحجي</b><br>${esc(db.settings.phone)}</div><hr>
<b>رقم الطلب: #${o.orderNumber}</b><br>${new Date(o.tl[o.tl.length-1].t).toLocaleString('ar-IQ')}<br>
رقم الزبون: <b>${esc(o.customerPhone)}</b><br>${o.address?'العنوان: '+esc(o.address)+' '+esc(o.near)+'<br>':''}الموظف: ${esc(o.employeeName)}${o.driverName?'<br>السائق: '+esc(o.driverName):''}<hr>
<table>${o.items.map(i=>`<tr><td>${esc(i.name)} ×${i.qty}</td><td>${fmt(i.price*i.qty)}</td></tr>`).join('')}</table><hr>
<table><tr><td>المجموع</td><td>${fmt(o.subtotal)}</td></tr><tr><td>التوصيل</td><td>${fmt(o.deliveryFee)}</td></tr><tr><td>الخصم</td><td>${fmt(o.discount)}</td></tr><tr><td><b>الإجمالي</b></td><td><b>${fmt(o.total)}</b></td></tr></table>
<hr>الدفع: ${o.payment.status==='paid'?'مدفوع':'عند الاستلام'}<br>${o.kNote||o.dNote?'ملاحظات: '+esc(o.kNote+' '+o.dNote)+'<br>':''}<div style="text-align:center">شكراً لزيارتكم</div>`}
function showReceipt(id){const o=Orders.get(id);ui.modal=`<h3>وصل الطلب #${o.orderNumber}</h3><div style="background:#fff;color:#000;padding:10px;border-radius:8px;font:12px monospace;margin:10px 0">${receiptHTML(o)}</div>
<div class="row"><button class="pri f1" data-a="print" data-id="${o.id}">🖨 طباعة</button><button data-a="close">إغلاق</button></div>${ui.printing===o.id?'<p style="color:var(--m);margin-top:8px">الطلب لن يذهب للمطبخ قبل نجاح الطباعة.</p><button data-a="manualprint" data-id="'+o.id+'" style="margin-top:6px">تمت الطباعة يدوياً (يُسجَّل)</button>':''}`;render()}
function doPrint(id){const o=Orders.get(id);try{$('#rc').innerHTML=receiptHTML(o);window.print();Orders.printed(o);ui.modal=null;toast('تمت الطباعة ✔ الطلب ذهب للمطبخ');render()}catch(e){toast('تعذر إكمال الطباعة — أعد المحاولة',1)}}
/* ===== Views ===== */
const statusPill=o=>`<span class="pill" style="${['CANCELLED','RETURNED','FAILED_DELIVERY'].includes(o.status)?'background:var(--bad);color:#2b0000':o.status==='COMPLETED'?'background:var(--ok);color:#06210f':'background:var(--g);color:#201a00'}">${ST[o.status]}</span>`;
function shell(body){const r=ui.route;return `<div class="top"><span class="brand">مطعم الحجي</span><span class="pill">${esc(me.name)} · ${{employee:'موظف',manager:'مدير',driver:'سائق'}[me.role]}</span><span class="sp"></span><span id="clk" class="pill"></span><button data-a="logout">خروج</button></div>
${ROUTES[me.role].length>1?`<div class="tabs">${ROUTES[me.role].map(x=>`<a href="#${x}" class="${x===r?'on':''}">${LABEL[x]}</a>`).join('')}</div>`:''}<main>${body}</main>`}
function loginView(){return `<div class="login"><h1>مطعم الحجي</h1><p style="color:var(--m);margin-bottom:14px">نظام تشغيل المطعم</p><div class="card"><input id="lu" placeholder="اسم المستخدم" autocomplete="username"><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="pri big" data-a="login">تسجيل الدخول</button></div></div>`}
function posView(){
 const d=db.draft,s=db.session,prods=db.products.filter(p=>p.active&&p.cat===d.cat),sub=d.items.reduce((a,i)=>a+i.price*i.qty,0),fee=d.type==='delivery'?db.settings.fee:0,tot=sub+fee-(+d.discount||0);
 return `<div class="card ${s?'call':''} row">${s?`<span>📞 مكالمة واردة</span><b dir="ltr">${esc(s.callerNumber)}</b><span class="pill" style="background:var(--ok);color:#06210f">● تم التعرف على الرقم</span><span class="sp"></span><button data-a="endcall">زبون لا يريد الطلب</button>`:`<span style="color:var(--m)">لا توجد مكالمة نشطة</span><span class="sp"></span><button class="gold" data-a="simcall">📞 محاكاة مكالمة</button>`}</div>
<div class="pos"><div class="cats">${CATS.map(c=>`<button class="${c===d.cat?'on':''}" data-a="cat" data-id="${c}">${c}</button>`).join('')}</div>
<div><div class="prods">${prods.map(p=>`<button class="prod ${p.on?'':'off'}" data-a="add" data-id="${p.id}">${esc(p.name)}<b>${fmt(p.price)}</b>${p.on?'':'<small>غير متوفر</small>'}</button>`).join('')||'<p style="color:var(--m)">لا توجد منتجات في هذا القسم</p>'}</div></div></div>
<div class="card" style="margin-top:12px"><h3>السلة</h3>${d.items.map((i,x)=>`<div class="row"><span class="f1">${esc(i.name)}</span><button data-a="dec" data-id="${x}">−</button><b>${i.qty}</b><button data-a="inc" data-id="${x}">+</button><span style="min-width:90px">${fmt(i.price*i.qty)}</span><button class="bad" data-a="rm" data-id="${x}">✕</button></div>`).join('')||'<p style="color:var(--m)">اختر منتجاً لإضافته</p>'}
<hr style="border-color:#38312f;margin:10px 0"><div class="grid"><select data-f="type"><option value="delivery" ${d.type==='delivery'?'selected':''}>توصيل</option><option value="takeaway" ${d.type==='takeaway'?'selected':''}>سفري</option></select>
<input data-f="phone" dir="ltr" placeholder="رقم الزبون" value="${esc(d.phone||(s?s.callerNumber:''))}"><input data-f="name" placeholder="اسم الزبون" value="${esc(d.name||'')}"><input data-f="addr" placeholder="العنوان" value="${esc(d.addr||'')}"><input data-f="near" placeholder="أقرب نقطة دالة" value="${esc(d.near||'')}">
<input data-f="knote" placeholder="ملاحظة للمطبخ" value="${esc(d.knote||'')}"><input data-f="dnote" placeholder="ملاحظة للسائق" value="${esc(d.dnote||'')}"><input data-f="discount" type="number" placeholder="خصم" value="${d.discount||''}"></div>
<p style="margin:10px 0">المجموع ${fmt(sub)} · توصيل ${fmt(fee)} · <b style="color:var(--g);font-size:20px">${fmt(tot)}</b></p><button class="pri big" data-a="review" ${ui.submitting?'disabled':''}>تأكيد الطلب</button></div>`}
function kitchenView(){

 open(el){const o=Orders.get(el.dataset.id);ask('طلب #'+o.orderNumber,`${statusPill(o)}<p dir="ltr" style="text-align:right">${esc(o.customerPhone)}</p><p>${esc(o.address)}</p>${o.items.map(i=>`<div>${esc(i.name)} ×${i.qty} — ${fmt(i.price*i.qty)}</div>`).join('')}<p><b>${fmt(o.total)}</b> · الموظف ${esc(o.employeeName)} · السائق ${esc(o.driverName||'-')}</p>${o.payment.difference?`<p style="color:var(--bad)">⚠️ فرق نقدي ${fmt(o.payment.difference)}</p>`:''}<h4>القصة الكاملة</h4>${timeline(o)}<div class="row" style="margin-top:10px"><button data-a="reprint" data-id="${o.id}">🖨 إعادة طباعة</button><button data-a="close">إغلاق</button></div>`)},
 saveset(){db.settings.phone=val('s_phone');db.settings.fee=+val('s_fee')||0;Audit.log('SETTINGS','settings','restaurant');save();toast('تم الحفظ')},
 avail(el){const p=db.products.find(x=>x.id===el.dataset.id);p.on=!p.on;Audit.log('AVAILABILITY','product',p.name,String(!p.on),String(p.on));save();render()},
 export(){const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hajji-backup.json';a.click()},
 reset(){ask('تأكيد',`<p>سيتم مسح كل البيانات الحالية. هل أنت متأكد؟</p><button class="bad big" data-a="reset2">نعم، تابع</button><button class="big" data-a="close">إلغاء</button>`)},
 reset2(){ask('تأكيد نهائي',`<p>لا يمكن التراجع عن هذه الخطوة.</p><button class="bad big" data-a="reset3">إعادة البيانات</button><button class="big" data-a="close">إلغاء</button>`)},
 reset3(){db=seed();save();ui.modal=null;toast('تمت إعادة بيانات التجربة');render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(!f)return;const act=el.dataset.a;
 const guard={assign:'employee',kstart:'employee',kready:'employee',submit:'employee',saveset:'manager',reset3:'manager',avail:'manager',export:'manager',daccept:'driver',dpick:'driver',dout:'driver',ddel2:'driver',dpay2:'driver',dfail2:'driver',dreject:'driver'}[act];
 if(guard&&me&&me.role!==guard&&!(guard==='employee'&&me.role==='manager')){Audit.log('DENIED','action',act,null,null,'صلاحية غير كافية');save();return toast('غير مصرح',1)}f(el)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){db.draft[t.dataset.f]=t.value;save();if(t.dataset.f==='discount'||t.dataset.f==='type')render()}if(t.id==='lp')return;if(t.id==='q'){ui.q=t.value;const p=t.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}}if(t.dataset.price){const p=db.products.find(x=>x.id===t.dataset.price),n=+t.value;if(n>0&&n!==p.price){db.prices.push({pid:p.id,old:p.price,new:n,by:me.name,t:Date.now()});Audit.log('PRICE','product',p.name,String(p.price),String(n));p.price=n;save()}}});
document.addEventListener('change',e=>{if(e.target.dataset.flt!==undefined){ui.filter=e.target.value;render()}if(e.target.dataset.f==='type')render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!me&&(e.target.id==='lu'||e.target.id==='lp'))A.login()});
render();
</script></body></html>
