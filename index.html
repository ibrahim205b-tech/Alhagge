<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطعم الحجي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--gold:#f2b705;--bg:#15110f;--card:#221c19;--tx:#fff;--mu:#a99d94;--ok:#2ecc71;--r:16px}
[data-th=light]{--bg:#faf5ee;--card:#fff;--tx:#241a16;--mu:#7a6c63}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--red);color:#fff;font-weight:700;transition:.15s}
button:active{transform:scale(.95)}button.g{background:var(--gold);color:#241a16}button.o{background:transparent;border:1px solid var(--mu)}
button:disabled{opacity:.4}
input,select,textarea{background:var(--card);border:1px solid #4443;border-radius:12px;padding:11px;width:100%}
.gold{color:var(--gold);font-weight:900}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,#c8102e55,transparent 50%),radial-gradient(circle at 10% 90%,#f2b70533,transparent 45%)}
.lbox{background:var(--card);padding:34px;border-radius:24px;width:min(380px,92vw);display:grid;gap:14px;box-shadow:0 20px 60px #0008;animation:up .6s}
.lbox h1{font-size:2.4rem;text-align:center}.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@keyframes pop{50%{transform:scale(1.08)}}@keyframes ring{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.top{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top b{font-size:1.3rem;margin-inline-end:auto}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px 14px}.tabs button{background:var(--card);white-space:nowrap}.tabs .on{background:var(--red)}
main{padding:12px 14px 90px}
.shop{display:flex;direction:ltr;gap:10px}
.cats{width:92px;display:grid;gap:6px;align-content:start;direction:rtl}.cats button{background:var(--card);font-size:.85rem;padding:12px 4px}.cats .on{background:var(--gold);color:#241a16}
.prods{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;direction:rtl}
.card{background:var(--card);border-radius:var(--r);padding:12px;display:grid;gap:6px;border:1px solid #4442}
.pc{text-align:center}.pc .em{font-size:2.4rem}.pc.pulse{animation:pop .3s}.pc.off{opacity:.45}
.price{color:var(--gold);font-weight:800}
.cart{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:2px solid var(--gold);padding:10px 14px;z-index:6;max-height:70vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:linear-gradient(135deg,var(--red),#7a0a1c);color:#fff;border-radius:var(--r);padding:16px}.stat b{font-size:1.8rem;display:block}.stat.gd{background:linear-gradient(135deg,var(--gold),#c98f00);color:#241a16}
.bd{padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:#666;color:#fff}
.NEW{background:#3498db}.PREP{background:#e67e22}.READY{background:var(--gold);color:#241a16}.PICKED{background:#9b59b6}.DELIVERED{background:var(--ok)}.RETURNED{background:var(--red)}
.bar{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .6s}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20}.modal>div{background:var(--card);padding:22px;border-radius:20px;width:min(420px,92vw);display:grid;gap:10px;max-height:85vh;overflow:auto;animation:up .3s}
.toast{position:fixed;top:14px;inset-inline:14px;margin:auto;max-width:420px;background:var(--gold);color:#241a16;padding:12px;border-radius:14px;font-weight:800;z-index:30;animation:up .3s;text-align:center}
.call{background:var(--ok);color:#042;padding:10px;border-radius:14px;font-weight:800;animation:pop 1s infinite}.call span{display:inline-block;animation:ring .5s infinite}
.tl{border-inline-start:3px solid var(--gold);padding-inline-start:12px;display:grid;gap:8px}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block;width:80mm;color:#000;background:#fff;font:12px monospace;direction:rtl}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app"></div><div id="rc"></div>
<script>
/* ===== UTILS ===== */
const MEM={};const ST={g(k){try{return localStorage.getItem(k)}catch(e){return MEM['l'+k]}},s(k,v){MEM['l'+k]=v;try{localStorage.setItem(k,v)}catch(e){}},d(k){delete MEM['l'+k];try{localStorage.removeItem(k)}catch(e){}}};
const SS={g(k){try{return sessionStorage.getItem(k)}catch(e){return MEM['s'+k]}},s(k,v){MEM['s'+k]=v;try{sessionStorage.setItem(k,v)}catch(e){}},d(k){delete MEM['s'+k];try{sessionStorage.removeItem(k)}catch(e){}}};
const $=s=>document.querySelector(s),fm=n=>Number(n).toLocaleString('en')+' د.ع',tm=t=>new Date(t).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
const SL={NEW:'جديد',PREP:'قيد التحضير',READY:'جاهز',PICKED:'مع السائق',DELIVERED:'مسلّم',RETURNED:'مسترجع'};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2800)}
function ask(title,opts,cb){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h3>${title}</h3>${opts.map(o=>`<button class="o">${o}</button>`).join('')}<button class="g" data-x>إلغاء</button></div>`;m.onclick=e=>{if(e.target.dataset.x!==undefined||e.target===m)return m.remove();if(e.target.classList.contains('o')){m.remove();cb(e.target.textContent)}};document.body.append(m)}
/* ===== DATABASE ===== */
const CATS=['العروض','شرقي','فلافل','دجاج','مشويات','مقبلات','مشروبات','حلويات'];
const seed=()=>({seq:1004,
users:[{u:'0000',p:'8876',role:'emp',n:'موظف الاستقبال',on:1},{u:'Yahya',p:'07712323615##@',role:'mgr',n:'يحيى',on:1},
{u:'1111',p:'1234',role:'drv',n:'أحمد',on:1},{u:'2222',p:'12345',role:'drv',n:'علي',on:1},{u:'3333',p:'12345',role:'drv',n:'حسين',on:1},{u:'4444',p:'1234',role:'drv',n:'محمد',on:0}],
cats:CATS,
prods:[['كباب عراقي',9000,'مشويات','🍢'],['تكة لحم',11000,'مشويات','🥩'],['شاورما دجاج',5000,'دجاج','🌯'],['نصف دجاجة مشوية',8000,'دجاج','🍗'],['فلافل سندويچ',1500,'فلافل','🧆'],['قرص فلافل ×6',3000,'فلافل','🧆'],['حمص',3000,'مقبلات','🥣'],['تبولة',3500,'مقبلات','🥗'],['متبّل',3000,'مقبلات','🍆'],['مشروب غازي',1000,'مشروبات','🥤'],['ماء',500,'مشروبات','💧'],['شاي',750,'مشروبات','🍵'],['كنافة',4000,'حلويات','🍮'],['وجبة عائلية',35000,'العروض','🍱'],['عرض الحجي ×2',16000,'العروض','🔥'],['برياني',7000,'شرقي','🍛']].map((p,i)=>({id:i+1,n:p[0],pr:p[1],c:p[2],e:p[3],on:true,d:'طازج ومحضّر عند الطلب'})),
orders:[],audit:[],notes:[]});
let S;
function load(){try{S=JSON.parse(ST.g('hg'))}catch(e){}if(!S||!S.users){S=seed();seedOrders();save()}}
function save(){try{ST.s('hg',JSON.stringify(S))}catch(e){toast('فشل الحفظ')}}
function seedOrders(){const d=[['اتصال',['كباب عراقي',2],'DELIVERED','أحمد'],['اتصال',['شاورما دجاج',3],'DELIVERED','علي'],['اتصال',['برياني',1],'RETURNED','حسين','الزبون لم يستلم']];
d.forEach((x,i)=>{const p=S.prods.find(p=>p.n==x[1][0]),t=Date.now()-3600e3*(5-i*2);S.orders.push({id:'HG-'+(1001+i),ph:'0770000000'+i,items:[{id:p.id,n:p.n,pr:p.pr,q:x[1][1]}],dl:2000,ds:0,tot:p.pr*x[1][1]+2000,nt:'',st:x[2],emp:'موظف الاستقبال',drv:x[3],t,tl:[[t,'إنشاء الطلب','موظف الاستقبال'],[t+6e5,'جاهز','المطبخ'],[t+12e5,'استلمه '+x[3],x[3]],[t+36e5,x[2]=='DELIVERED'?'تم التسليم':'مرتجع: '+x[4],x[3]]],rs:x[4]||''})})}
/* ===== AUDIT / BUS ===== */
function audit(a,id,prev,next,why){const s=ses();S.audit.unshift({t:Date.now(),who:s?s.n:'-',role:s?s.role:'',a,id:id||'',prev:prev||'',next:next||'',why:why||''});S.audit=S.audit.slice(0,300)}
function notify(m){S.notes.unshift({t:Date.now(),m});S.notes=S.notes.slice(0,50)}
function commit(){save();render();}
window.addEventListener('storage',e=>{if(e.key=='hg'){load();render()}});
/* ===== AUTH ===== */
let T=0;const ses=()=>{try{const s=JSON.parse(SS.g('hs')||ST.g('hs'));return Date.now()-s.t>18e5?null:s}catch(e){return null}};
const need=r=>{const s=ses();if(!s||s.role!=r){toast('غير مصرّح');logout(true);throw 0}return s};
function login(u,p,rem){const x=S.users.find(a=>a.u===u&&a.p===p&&a.on!==false&&!a.off);if(!x)return false;
const s={u:x.u,role:x.role,n:x.n,t:Date.now()};(rem?ST:SS).s('hs',JSON.stringify(s));x.on=1;audit('تسجيل دخول');save();return true}
function logout(q){audit('تسجيل خروج');const s=ses();if(s&&s.role=='drv'){const d=S.users.find(a=>a.u==s.u);d.on=0}save();SS.d('hs');ST.d('hs');if(!q)render();else render()}
/* ===== ORDERS ===== */
let C={items:{},ph:'',dl:0,ds:0,nt:'',cat:'العروض',tab:'new',busy:0,call:null};
const cartItems=()=>Object.entries(C.items).map(([id,q])=>({...S.prods.find(p=>p.id==id),q})).filter(i=>i.q>0);
const sub=()=>cartItems().reduce((a,i)=>a+i.pr*i.q,0);
function add(id,d){C.items[id]=Math.max(0,(C.items[id]||0)+d);render(d>0?id:0)}
function confirmOrder(){const s=need('emp');if(C.busy)return;const it=cartItems();if(!it.length)return toast('السلة فارغة');C.busy=1;
const ds=Math.min(Math.max(+C.ds||0,0),Math.floor(sub()*.1));const id='HG-'+(++S.seq),t=Date.now();
const o={id,ph:C.ph||C.call||'',items:it.map(i=>({id:i.id,n:i.n,pr:i.pr,q:i.q})),dl:+C.dl||0,ds,nt:C.nt,tot:sub()+(+C.dl||0)-ds,st:'NEW',emp:s.n,drv:'',t,tl:[[t,'إنشاء الطلب وتأكيده',s.n],[t+1,'إرسال للمطبخ',s.n]]};
S.orders.unshift(o);audit('إنشاء طلب',id,'','NEW');notify('طلب جديد '+id);save();
C={...C,items:{},ph:'',dl:0,ds:0,nt:'',call:null,busy:0};receipt(o);render()}
function setSt(id,st,who,txt){const o=S.orders.find(x=>x.id==id);if(!o)return;if(o.st==st)return;audit(txt||SL[st],id,o.st,st);o.tl.push([Date.now(),txt||SL[st],who]);o.st=st;save()}
function ret(id,why,who){const o=S.orders.find(x=>x.id==id);o.rs=why;setSt(id,'RETURNED',who,'مرتجع: '+why);notify('طلب مسترجع '+id);commit()}
function kitchen(id,st){const s=ses();if(!s||s.role=='drv')return toast('غير مصرّح');setSt(id,st,s.n);if(st=='READY')notify('طلب جاهز '+id);commit()}
function pick(id){const s=need('drv');const o=S.orders.find(x=>x.id==id);if(!o||o.st!='READY')return toast('الطلب غير متاح');o.drv=s.n;setSt(id,'PICKED',s.n,'استلمه '+s.n);notify('🛵 '+s.n+' استلم الطلب '+id);commit();toast('تم الاستلام')}
function deliver(id){const s=need('drv');const o=S.orders.find(x=>x.id==id);if(o.drv!=s.n)return;setSt(id,'DELIVERED',s.n,'تم التسليم');notify('✓ تم تسليم '+id+' بواسطة '+s.n);commit();toast('✓ تم التسليم')}
/* ===== PRINT ===== */
function receipt(o){$('#rc').innerHTML=`<center><b style="font-size:16px">مطعم الحجي</b><br>${o.id} — ${new Date(o.t).toLocaleString('ar-IQ')}<br>${o.ph}</center><hr>${o.items.map(i=>`${i.n} ×${i.q} ... ${i.pr*i.q}<br>`).join('')}<hr>التوصيل: ${o.dl}<br>الخصم: ${o.ds}<br><b>الإجمالي: ${o.tot}</b><br>${o.nt}`;toast('جاري تجهيز الوصل…');setTimeout(()=>window.print(),700)}
/* ===== UI ===== */
const bd=s=>`<span class="bd ${s}">${SL[s]}</span>`;
function render(pulse){const s=ses(),a=$('#app');if(!s){a.innerHTML=`<div class="login"><div class="lbox" id="lf"><h1 class="gold">مطعم الحجي</h1><p style="text-align:center;color:var(--mu)">نظام تشغيل المطعم</p><input id="u" placeholder="اسم المستخدم" autocomplete="off"><div style="position:relative"><input id="p" type="password" placeholder="كلمة المرور"><button type="button" class="o" id="sp" style="position:absolute;left:4px;top:4px;padding:6px 10px">👁</button></div><label><input type="checkbox" id="rm" style="width:auto"> تذكّرني</label><button type="button" id="lb">تسجيل الدخول</button></div></div>`;
$('#sp').onclick=()=>$('#p').type=$('#p').type=='password'?'text':'password';
const go=()=>{try{const dg=x=>x.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).trim();const uu=dg($('#u').value),pp=$('#p').value.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);$('#lb').textContent='⏳ جاري الدخول…';setTimeout(()=>{try{if(login(uu,pp,$('#rm').checked))render();else{$('#lb').textContent='تسجيل الدخول';$('#lf').classList.remove('shake');void $('#lf').offsetWidth;$('#lf').classList.add('shake');toast('بيانات الدخول غير صحيحة')}}catch(e){$('#lb').textContent='تسجيل الدخول';toast('خطأ: '+e.message)}},400)}catch(e){toast('خطأ: '+e.message)}};
$('#lb').onclick=go;['#u','#p'].forEach(i=>$(i).onkeydown=e=>{if(e.key=='Enter')go()});return}
const view={emp:vEmp,mgr:vMgr,drv:vDrv}[s.role];
a.innerHTML=`<div class="top"><b class="gold">مطعم الحجي</b><span>${s.n}</span><button class="o" id="th">🌓</button><button class="o" id="lo">خروج</button></div>`+view(s,pulse);
$('#th').onclick=()=>{document.documentElement.dataset.th=document.documentElement.dataset.th=='light'?'':'light'};$('#lo').onclick=()=>logout();
a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{C.tab=b.dataset.t;render()});
a.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{C.cat=b.dataset.c;render()});
a.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));
['ph','dl','ds','nt'].forEach(k=>{const e=$('#'+k);if(e)e.oninput=()=>{C[k]=e.value;const t=$('#tot');if(t)t.textContent=fm(sub()+(+C.dl||0)-Math.min(+C.ds||0,Math.floor(sub()*.1)))}})}
function act(a,i){try{const A={
add:()=>add(+i,1),sub:()=>add(+i,-1),ok:confirmOrder,call:()=>{C.call='078'+Math.floor(1e7+Math.random()*9e7);C.ph=C.call;render();setTimeout(()=>{if(C.call&&!cartItems().length){C.call=null;C.ph='';render()}},15e3)},
print:()=>receipt(S.orders.find(o=>o.id==i)),
ret:()=>{const s=need('emp');ask('سبب الاسترجاع',['الزبون لم يستلم','خطأ بالطلب','مشكلة بالتوصيل','إلغاء من الزبون','سبب آخر'],w=>ret(i,w,s.n))},
prep:()=>kitchen(i,'PREP'),ready:()=>kitchen(i,'READY'),pick:()=>pick(i),dv:()=>deliver(i),
fail:()=>{const s=need('drv');ask('سبب الفشل',['رفض الطلب','الزبون غير موجود','لا يجيب','العنوان خطأ','سبب آخر'],w=>ret(i,w,s.n))},
tl:()=>{need('mgr');const o=S.orders.find(x=>x.id==i);const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h3>${o.id} ${bd(o.st)}</h3><div class="tl">${o.tl.map(x=>`<div><b>${x[1]}</b><br><small>${tm(x[0])} — ${x[2]}</small></div>`).join('')}</div><button class="g">إغلاق</button></div>`;m.onclick=e=>{if(e.target.tagName=='BUTTON'||e.target==m)m.remove()};document.body.append(m)},
price:()=>{const s=need('mgr');const p=S.prods.find(x=>x.id==i);const v=prompt('السعر الجديد',p.pr);if(v&&+v>0){audit('تغيير سعر',p.n,p.pr,+v);p.pr=+v;commit()}},
avail:()=>{need('mgr');const p=S.prods.find(x=>x.id==i);p.on=!p.on;audit('تغيير توفر',p.n,!p.on,p.on);commit()},
addp:()=>{need('mgr');const n=prompt('اسم المنتج'),pr=+prompt('السعر'),c=prompt('التصنيف',S.cats[0]);if(n&&pr){S.prods.push({id:Date.now(),n,pr,c,e:'🍽',on:true,d:'منتج جديد'});audit('إضافة منتج',n);commit()}},
addd:()=>{need('mgr');const n=prompt('اسم السائق'),u=prompt('اسم المستخدم'),p=prompt('كلمة المرور');if(n&&u&&p){S.users.push({u,p,role:'drv',n,on:0});audit('إضافة سائق',n);commit()}},
tog:()=>{need('mgr');const d=S.users.find(x=>x.u==i);d.off=!d.off;audit(d.off?'تعطيل سائق':'تفعيل سائق',d.n);commit()}};A[a]()}catch(e){if(e)console.error(e)}}
function vEmp(s,pulse){const t=C.tab,L=S.orders.filter(o=>o.st!='DELIVERED'&&o.st!='RETURNED').length;
const tabs=`<div class="tabs">${[['new','طلب جديد'],['my','الطلبات ('+S.orders.length+')'],['kit','المطبخ ('+L+')']].map(x=>`<button data-t="${x[0]}" class="${t==x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
if(t=='my')return tabs+`<main>${S.notes.slice(0,3).map(n=>`<div class="card">${n.m}</div>`).join('')}${S.orders.map(o=>`<div class="card"><div class="row"><b>${o.id}</b>${bd(o.st)}</div><div>${o.items.map(i=>i.n+'×'+i.q).join('، ')}</div><div class="row"><span class="price">${fm(o.tot)}</span><span>${o.drv?'🛵 '+o.drv:''}</span></div><div class="row"><button data-a="print" data-i="${o.id}" class="o">🖨</button>${o.st!='RETURNED'?`<button data-a="ret" data-i="${o.id}">استرجاع</button>`:''}</div></div>`).join('')}</main>`;
if(t=='kit')return tabs+kitHtml();
const it=cartItems(),n=it.reduce((a,i)=>a+i.q,0),sb=sub();
return tabs+`<main>${C.call?`<div class="call"><span>📞</span> مكالمة واردة ${C.call}</div><br>`:''}<div class="shop"><div class="prods">${S.prods.filter(p=>p.c==C.cat).map(p=>`<div class="card pc ${p.on?'':'off'} ${pulse==p.id?'pulse':''}"><div class="em">${p.e}</div><b>${p.n}</b><small style="color:var(--mu)">${p.d}</small><span class="price">${fm(p.pr)}</span>${p.on?`<div class="row"><button data-a="sub" data-i="${p.id}">−</button><b>${C.items[p.id]||0}</b><button class="g" data-a="add" data-i="${p.id}">+</button></div>`:'<small>غير متوفر</small>'}</div>`).join('')}</div><div class="cats">${S.cats.map(c=>`<button data-c="${c}" class="${C.cat==c?'on':''}">${c}</button>`).join('')}<button class="g" data-a="call">📞 محاكاة اتصال</button></div></div></main>
<div class="cart"><div class="row"><b>🛒 السلة (${n})</b><b class="gold" id="tot">${fm(sb+(+C.dl||0)-Math.min(+C.ds||0,Math.floor(sb*.1)))}</b></div>${n?`${it.map(i=>`<div class="row"><span>${i.n} ×${i.q}</span><span>${fm(i.pr*i.q)}</span></div>`).join('')}<input id="ph" placeholder="رقم الزبون" value="${C.ph}"><div class="grid" style="margin:6px 0"><input id="dl" type="number" placeholder="توصيل" value="${C.dl||''}"><input id="ds" type="number" placeholder="خصم (حد 10%)" value="${C.ds||''}"></div><input id="nt" placeholder="ملاحظات" value="${C.nt}"><button class="g" data-a="ok" style="width:100%;margin-top:8px">تم</button>`:''}</div>`}
function kitHtml(){const r=S.orders.filter(o=>['NEW','PREP','READY'].includes(o.st));return `<main><div class="grid">${r.map(o=>`<div class="card"><div class="row"><b>${o.id}</b>${bd(o.st)}</div>${o.items.map(i=>`<div>${i.q}× ${i.n}</div>`).join('')}<small>${o.nt}</small><small>${tm(o.t)}</small>${o.st=='NEW'?`<button data-a="prep" data-i="${o.id}">بدء التحضير</button>`:o.st=='PREP'?`<button class="g" data-a="ready" data-i="${o.id}">جاهز</button>`:''}</div>`).join('')||'<p>لا توجد طلبات بالمطبخ</p>'}</div></main>`}
function stats(){const O=S.orders,d=O.filter(o=>o.st=='DELIVERED'),r=O.filter(o=>o.st=='RETURNED'),net=O.filter(o=>o.st!='RETURNED');return{all:O.length,d:d.length,r:r.length,sales:net.reduce((a,o)=>a+o.tot,0),rv:r.reduce((a,o)=>a+o.tot,0),disc:O.reduce((a,o)=>a+o.ds,0),dl:net.reduce((a,o)=>a+o.dl,0),avg:net.length?Math.round(net.reduce((a,o)=>a+o.tot,0)/net.length):0}}
function vMgr(s){const t=C.tab=='new'||['my','kit'].includes(C.tab)?'home':C.tab,st=stats();
const T=[['home','الرئيسية'],['ord','الطلبات'],['kit','المطبخ'],['drv','السائقون'],['prd','المنتجات'],['ret','المرتجعات'],['aud','سجل العمليات'],['not','الإشعارات']];
let b='';const drvs=S.users.filter(u=>u.role=='drv');
if(t=='home'){const top={};S.orders.filter(o=>o.st!='RETURNED').forEach(o=>o.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=tp[0]?tp[0][1]:1;
b=`<div class="grid"><div class="stat gd">إجمالي المبيعات<b>${fm(st.sales)}</b></div><div class="stat">الطلبات<b>${st.all}</b></div><div class="stat">المسلّمة<b>${st.d}</b></div><div class="stat">المرتجعات<b>${st.r} (${fm(st.rv)})</b></div><div class="stat">متوسط الطلب<b>${fm(st.avg)}</b></div><div class="stat">الخصومات / التوصيل<b>${fm(st.disc)} / ${fm(st.dl)}</b></div></div><h3 style="margin:14px 0">الحالات</h3><div class="grid">${Object.keys(SL).map(k=>`<div class="card"><div class="row">${bd(k)}<b>${S.orders.filter(o=>o.st==k).length}</b></div></div>`).join('')}</div><h3 style="margin:14px 0">السائقون مباشرة</h3><div class="grid">${drvs.map(d=>{const c=S.orders.find(o=>o.st=='PICKED'&&o.drv==d.n);return `<div class="card"><b>${d.n}</b>${d.off?'⚪ معطّل':!d.on?'⚪ غير متصل':c?'🟢 في الطريق '+c.id:'🟡 بانتظار طلب'}</div>`}).join('')}</div><h3 style="margin:14px 0">الأكثر مبيعاً</h3>${tp.map(x=>`<div class="row"><span style="width:130px">${x[0]}</span><div class="bar" style="width:${x[1]/mx*70}%"></div><b>${x[1]}</b></div>`).join('')}`}
if(t=='ord')b=S.orders.map(o=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${o.id}</b>${bd(o.st)}<span class="price">${fm(o.tot)}</span></div><div class="row"><small>${o.emp} ${o.drv?'🛵 '+o.drv:''}</small><button data-a="tl" data-i="${o.id}" class="g">المسار</button></div></div>`).join('');
if(t=='kit')b=kitHtml();
if(t=='drv')b=`<button data-a="addd" class="g">+ سائق</button><div class="grid" style="margin-top:10px">${drvs.map(d=>{const m=S.orders.filter(o=>o.drv==d.n),dv=m.filter(o=>o.st=='DELIVERED').length,rt=m.filter(o=>o.st=='RETURNED').length;return `<div class="card"><b>${d.n}</b><small>المستخدم: ${d.u}</small><div>اليوم: ${m.length} · مسلّم ${dv} · مرتجع ${rt}</div><div>النجاح: ${m.length?Math.round(dv/m.length*100):0}%</div><button data-a="tog" data-i="${d.u}" class="o">${d.off?'تفعيل':'تعطيل'}</button></div>`}).join('')}</div>`;
if(t=='prd')b=`<button data-a="addp" class="g">+ منتج</button>${S.prods.map(p=>`<div class="row card" style="margin-top:8px"><span>${p.e} ${p.n} <small>${p.c}</small></span><span><button data-a="price" data-i="${p.id}" class="o">${fm(p.pr)}</button> <button data-a="avail" data-i="${p.id}" class="${p.on?'':'o'}">${p.on?'متوفر':'متوقف'}</button></span></div>`).join('')}`;
if(t=='ret')b=S.orders.filter(o=>o.st=='RETURNED').map(o=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${o.id}</b><span class="price">${fm(o.tot)}</span></div><small>السبب: ${o.rs} · الموظف: ${o.emp} · السائق: ${o.drv||'-'}</small></div>`).join('')||'<p>لا توجد مرتجعات</p>';
if(t=='aud')b=S.audit.slice(0,80).map(a=>`<div class="card" style="margin-bottom:6px"><b>${a.a}</b> ${a.id} <small>— ${a.who} · ${tm(a.t)} ${a.prev?a.prev+'→'+a.next:''} ${a.why}</small></div>`).join('');
if(t=='not')b=S.notes.map(n=>`<div class="card" style="margin-bottom:6px">${n.m} <small>${tm(n.t)}</small></div>`).join('')||'<p>لا إشعارات</p>';
C.tab=t;return `<div class="tabs">${T.map(x=>`<button data-t="${x[0]}" class="${t==x[0]?'on':''}">${x[1]}</button>`).join('')}</div><main style="padding-bottom:20px">${b}</main>`}
function vDrv(s){const rd=S.orders.filter(o=>o.st=='READY'),my=S.orders.filter(o=>o.st=='PICKED'&&o.drv==s.n),dn=S.orders.filter(o=>o.drv==s.n&&o.st=='DELIVERED').length,rt=S.orders.filter(o=>o.drv==s.n&&o.st=='RETURNED').length;
return `<main><div class="grid"><div class="stat gd">مسلّم<b>${dn}</b></div><div class="stat">مرتجع<b>${rt}</b></div></div><h3 style="margin:12px 0">طلباتي الحالية</h3>${my.map(o=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${o.id}</b><span class="price">${fm(o.tot)}</span></div><div>📞 ${o.ph}</div><small>${o.nt}</small><div class="row"><button class="g" data-a="dv" data-i="${o.id}">تم التسليم</button><button data-a="fail" data-i="${o.id}">لم يستلم الزبون</button></div></div>`).join('')||'<p>لا طلبات حالياً</p>'}<h3 style="margin:12px 0">الطلبات الجاهزة</h3>${rd.map(o=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${o.id}</b><span class="price">${fm(o.tot)}</span></div><div>📞 ${o.ph}</div><button class="g" data-a="pick" data-i="${o.id}">تم الاستلام</button></div>`).join('')||'<p>لا توجد طلبات جاهزة</p>'}</main>`}
/* ===== BOOT ===== */
load();render();setInterval(()=>{if(!ses()&&$('#lf')==null)render()},3e4);
</script></body></html>
